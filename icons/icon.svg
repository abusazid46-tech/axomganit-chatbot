<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="50%" stop-color="#059669" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="100%" stop-color="#eab308" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.35" />
    </filter>
  </defs>
  
  <!-- App Background (Squircle) -->
  <rect x="24" y="24" width="464" height="464" rx="100" fill="url(#bgGrad)" filter="url(#shadow)" />
  
  <!-- Subtle Grid Accent -->
  <path d="M120 180 L400 180 M120 320 L400 320 M200 120 L200 400 M340 120 L340 400" stroke="rgba(255,255,255,0.12)" stroke-width="2" />
  
  <!-- Square Root Symbol -->
  <path d="M110 270 L145 270 L185 365 L245 160 L410 160" fill="none" stroke="#ffffff" stroke-width="26" stroke-linecap="round" stroke-linejoin="round" />
  
  <!-- Mathematical Pi Symbol -->
  <path d="M255 220 L335 220 M275 220 L265 340 M315 220 L325 340 C325 350 335 352 342 346" fill="none" stroke="url(#goldGrad)" stroke-width="20" stroke-linecap="round" stroke-linejoin="round" />
  
  <!-- Assamese Character 'অ' / Math Accent -->
  <circle cx="375" cy="270" r="14" fill="#ffffff" />
  <circle cx="160" cy="180" r="8" fill="url(#goldGrad)" />
</svg>
